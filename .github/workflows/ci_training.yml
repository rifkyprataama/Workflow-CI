name: CI Training & MLflow Docker Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # 1. Setup Environment Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # 2. Instalasi MLflow
      - name: Install MLflow & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas scikit-learn

      # 3. Menjalankan MLProject (Pelatihan Model)
      - name: Run MLflow Project
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          cd MLProject
          mlflow run . --env-manager local
          
      # 4. Upload Artefak ke GitHub (Syarat Skilled & Advance)
      - name: Upload MLruns Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: MLProject/mlruns/
          retention-days: 5

      # 5. Login ke Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build Docker Image Menggunakan MLflow
      - name: Build Docker Image from MLflow Model
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          cd MLProject
          
          # Trik cerdas: Mengambil ID Folder secara otomatis (mengabaikan meta.yaml)
          RUN_ID=$(ls mlruns/0 | grep -v meta.yaml | head -n 1)
          echo "Membangun Docker dengan Run ID yang benar: $RUN_ID"
          
          # Membangun docker image
          mlflow models build-docker -m "mlruns/0/$RUN_ID/artifacts/model" -n "rifkyprataama/gojek-sentiment-model:latest"

      # 7. Push Docker Image ke Docker Hub
      - name: Push Docker Image to Docker Hub
        run: |
          docker push rifkyprataama/gojek-sentiment-model:latest