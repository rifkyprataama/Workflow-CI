name: CI Training & MLflow Docker Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install MLflow & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas scikit-learn

      - name: Run Model Training
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          cd MLProject
          python modelling.py
          
      - name: Upload MLruns Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: MLProject/mlruns/
          retention-days: 5

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
          # Memberi tahu MLflow di mana database mlruns berada
          MLFLOW_TRACKING_URI: "file:./mlruns"
        run: |
          cd MLProject
          RUN_ID=$(cat run_id.txt)
          echo "Membangun Docker dengan Run ID: $RUN_ID"
          
          # MENGGUNAKAN URI RESMI "runs:/" AGAR MLFLOW MENCARI SENDIRI LOKASI MODELNYA
          mlflow models build-docker -m "runs:/$RUN_ID/model" -n "rifkyprataama/gojek-sentiment-model:latest"

      - name: Push Docker Image to Docker Hub
        run: |
          docker push rifkyprataama/gojek-sentiment-model:latest